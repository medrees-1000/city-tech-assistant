[project]
name = "cta"
version = "0.1.0"
description = "City Tech Assistant: RAG over City Tech registration, aid and department data"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "openai>=3.29.0",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the Docker Postgres (skipped when it is not running)"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
