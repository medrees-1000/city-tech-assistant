# Rule 4: first-person account words (lowercase, whole words) -> office. Written knowing dev q44.
cues:
  registrar: ["my gpa", "my grade", "my grades", "my transcript"]
  bursar: ["my balance", "my bill", "my tuition"]
  financial-aid: ["my financial aid", "my aid", "my fafsa", "my tap", "my refund"]

# Account words with NO office (the data names none): the abstention is the personal-account message
# and no card is shown. They count only when the system already abstains.
account_only: ["emplid", "student id", "log in", "login", "password"]

# Rule 5: chunk ids "pdf/<name>#n" -> office. page/, dept/, contact: and catalog: chunks need no entry
# (their owner or department is in the id or in the chunk).
pdf_offices:
  dropping-withdrawing-fall-2026: registrar
  financial-aid-refund-calendar-2026-2027: financial-aid
  special-circumstances-flyer: special-circumstances
  cunyfirst-student-reference: financial-aid

# Rule 7: nothing above applies.
fallback: registrar
