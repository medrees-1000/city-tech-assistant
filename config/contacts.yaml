# Rule 4: first-person account words (lowercase, whole words) -> office. Written knowing dev q44.
cues:
  registrar: ["my gpa", "my grade", "my grades", "my transcript"]
  bursar: ["my balance", "my bill", "my tuition"]
  financial-aid: ["my financial aid", "my aid", "my fafsa", "my tap", "my refund"]

# Account words with NO office (the data names none): the abstention is the personal-account message
# and no card is shown. They count only when the system already abstains.
account_only: ["emplid", "student id", "log in", "login", "password", "my hold", "my holds", "a hold on my", "my account",
               "how much do i owe", "is my application complete"]   # the last two: tester round 1b follow-up

# Which retrieval abstentions are shown as the personal-account refusal (docs/decisions.md, "Near-miss polish and
# possessive cue"). The cues above still choose the contact card; this only decides the refusal.
# A "noun cue" (a possessive plus an office noun, such as "my financial aid") is NOT enough by itself: it needs an
# account signal. Every other office cue above (my gpa, my grades, my transcript, my balance) names account data
# by itself. The account_only words always count.
noun_cues: ["my financial aid", "my aid", "my fafsa", "my tap", "my refund", "my tuition", "my bill"]
account_signals: ["status", "approved", "denied", "deposited", "pending", "owe", "owed", "did my", "has my", "have my",
                  "why is my", "why was my", "why did my", "why hasn't my", "where is my", "wheres my", "where's my"]

# Rule 5 (batch 1, Oct 17, 2026): topic words -> office, used only when none of the rules above names an office
# (a refusal that would otherwise carry no contact). Whole words or phrases, lowercase, matched case-insensitively
# on the question. Inflections and the typos seen in the held-out questions are listed as aliases. At most two
# offices are added, in the order of `topic_priority`; the first is the main one (the page shows it as the card).
# The words come from what each office handles, not from a fit to one question set; written to be reviewed.
topic_priority: [DENT-NYT, financial-aid, bursar, advisement, registrar]
topic_cues:
  DENT-NYT: [dental, hygiene, hygine, hygein, hygeine, hugein]
  financial-aid: [fafsa, tap, pell, aid, scholarship, scholarships, sap, "financial aid"]
  bursar: [tuition, tution, tuiton, payment, payments, pay, bill, fee, fees, "refund balance", refund,
           refunds, refunded, "money back"]
  # "credits still left" and "why am i taking" were added AFTER seeing the held-out questions cv2-05 and cv2-10,
  # so the replay on those two questions is not an independent test of the cues.
  advisement: [advisor, advisors, advsor, advisr, advising, "degree audit", "graduate early", "graudate early",
               "graduating early", "credits left", "credits still left", "credits remaining", "why am i taking"]
  registrar: [graduate, graduation, graduating, graudate, graudation, grudation, transcript, grades, grade,
              enrollment, drop, dropping, withdraw, withdrawing, withdrawal, registration, registring,
              registeration, calendar, registrar,
              # added Oct 17, 2026, found by review (the owner noticed that "how to register" got no contact),
              # not by an eval run: register, registering, registered, sign up for classes, enroll, enrolling
              register, registering, registered, "sign up for classes", "sign up for a class", enroll, enrolling]
# Phrases removed from the question before the topic words are matched, so an ordinary use of a cue word does not
# add an office ("registered nurse" is a profession, not a registration question).
topic_ignore: ["registered nurse", "registered nurses", "registered dental hygienist", "registered dental hygienists"]
