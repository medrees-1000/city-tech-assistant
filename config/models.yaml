# Models, prices and run limits for Phase 2 (baseline RAG).
# Prices are USD per 1M tokens (standard tier, input <= 272K tokens), read on 2026-10-12 from
#   https://developers.openai.com/api/docs/pricing          (no page date; newest entry July 30, 2026)
#   https://developers.openai.com/api/docs/models           (no page date)
#   https://developers.openai.com/api/docs/models/gpt-6-luna and .../gpt-5.6-terra (no page date)
#   https://developers.openai.com/api/docs/guides/embeddings (no page date)
#   https://developers.openai.com/api/docs/deprecations     (newest entry 2026-10-01)
# Override the three model names with CTA_EMBEDDING_MODEL, CTA_CHAT_MODEL, CTA_JUDGE_MODEL in .env.
# A model that is not in `models` below is refused, so cost is never silently zero.

embedding_model: text-embedding-3-small
chat_model: gpt-6-luna          # answers
judge_model: gpt-5.6-terra      # eval judge: stronger than the answer model, on purpose

answer:
  # Model that writes retrieval-route answers (docs/archive/model-experiment-plan.md). null = chat_model (today's
  # behaviour). The classifier, selector, topic call, reranker and the model-written chain answers always use
  # chat_model. CTA_ANSWER_MODEL and --answer-model override it.
  model: null
  # Checked 2026-10-12 with one real call to gpt-6-luna (Chat Completions): temperature, top_p and
  # reasoning_effort "none" were all accepted without error (docs/decisions.md).
  temperature: 0.1
  top_p: 0.3
  reasoning_effort: none
  k: 5
  max_output_tokens: 600
  # The advice route's retrieval call only (docs/decisions.md, "the advice route's output limit"): q47 needs
  # two rule sets and was cut off at 600. Every other call keeps max_output_tokens.
  advice_max_output_tokens: 1000
  # Chosen on dev only (step 8): the lowest top-1 similarity of an answerable, scored dev question is
  # 0.591 (q24); this is just below it, so no answerable dev question is blocked. It separates little:
  # see docs/decisions.md. Do not change it after looking at the test split.
  abstain_threshold: 0.59
  # Near-miss helper (docs/decisions.md, "Near-miss helper"): a below-threshold abstention whose best vector
  # similarity is within this margin under the cutoff lists the two closest pages instead of the bare refusal.
  # 0 switches it off. CTA_NEAR_MISS_MARGIN overrides it. The cutoff itself is not changed.
  near_miss_margin: 0.04
  # Version 2 rescue rule (docs/decisions.md, "Version 2, casual wording: pre-registration"): off | on. When on, a
  # question whose best vector similarity is under the cutoff but at least rescue_similarity_floor goes on to the
  # answer model (which can still abstain) if the reranker's top score is at least rescue_reranker_min (0 to 10).
  # The floor and the minimum were set from the dev diagnosis only. On since Oct 17, 2026 (owner decision, docs/decisions.md, "Version 2 result and decision"). Quoted (YAML booleans).
  rescue: "on"
  rescue_similarity_floor: 0.45
  rescue_reranker_min: 8
  # Quoted-sentence addenda (docs/decisions.md, "q50 fee line"): when a retrieval answer cites the chunk below and
  # does not already say it, code appends the sentence that starts with `starts_with`, copied from the chunk text at
  # run time (never written here). Nothing is appended if the chunk was not cited or the sentence is not in it.
  # An empty list switches this off. Since Oct 17, 2026 (owner decision) the sentence is appended only when the
  # question contains one of `quote_addenda_question_words` (whole words or phrases, case-insensitive); an empty
  # word list also switches it off.
  quote_addenda:
    - {chunk: "page/bursar/refund-policy#1", starts_with: "No portion of the student activity fee"}
    - {chunk: "page/admissions/tuition-refund#1", starts_with: "No portion of the student activity fee"}
  quote_addenda_question_words: [refund, refunds, refunded, refundable, "money back", "get back", reimburse]

# Judge settings. Probed 2026-10-12 on gpt-5.6-terra: temperature 0 is REJECTED with the default reasoning
# ("Only the default (1) value is supported"), but ACCEPTED with reasoning_effort "none"; JSON response
# format is accepted. So the judge runs at the lowest temperature, 0, with reasoning off.
judge:
  temperature: 0
  reasoning_effort: none
  max_output_tokens: 400

# Retrieval: exact vector search; the model reranker then reorders the best chunks.
retrieval:
  # LLM reranker (Phase 3, step 3): off | pool_a (the pool is fixed in src/cta/index/rerank.py).
  # CTA_RERANK overrides it. Quoted for the same YAML reason. pool_a since experiment 3 (kept by its
  # pre-registered rule); CTA_RERANK=off reproduces the earlier vector-only retrieval.
  rerank: "pool_a"

# Reranker call (the model is chat_model). Fixed in advance; see docs/experiments.md, step 3.
rerank:
  temperature: 0
  reasoning_effort: none
  max_output_tokens: 600

# Router (Phase 3, step 4a): off | on (on since step 4a-2, selector v2 kept by its pre-registered rule; CTA_ROUTER_MODE=off restores the old pipeline). With "on" a LangGraph graph (src/cta/graph/) sends calendar questions to a
# calendar lookup and everything else to the existing pipeline. CTA_ROUTER_MODE overrides it. Quoted: bare off/on are
# booleans in YAML. The classifier and the selector call the answer model (chat_model) with these settings.
router:
  mode: "on"
  # Selector version (step 4a-2): 1 = the pool is the rows of the resolved term; 2 = the rows of all
  # calendars with a stricter prompt. CTA_ROUTER_SELECTOR overrides it.
  selector: 2
  # Prerequisite-chain tool (Phase 3, step 4b): off | on (on since step 4b-final; CTA_ROUTER_CHAIN=off or --chain off turns it off). With "on" the classifier has a third intent,
  # "prerequisite", answered by a deterministic chain walk. CTA_ROUTER_CHAIN overrides it. Quoted (YAML booleans).
  chain: "on"
  # Who writes the chain answer (chain layout, docs/archive/chain-layout-plan.md): "model" = the answer model, from the
  # chain description (the 4b behaviour); "code" = plain code (cta.graph.chain_render), no model call after the
  # classifier. "code" since the pre-registered keep rule passed (docs/archive/chain-layout-results.md); "model" is the fallback. CTA_ROUTER_CHAIN_RENDER overrides it.
  chain_render: "code"
  # Contact line on every abstention (Phase 3, step 4c): off | on. Plain code (src/cta/graph/contact.py) appends
  # "Contact <name>: <email>, <phone>." from config/contacts.yaml; the model never writes it. On since step 4c
  # (replay check D1 to D8 of docs/archive/step4c-plan.md passed); CTA_ROUTER_CONTACTS=off or --contacts off turns it off. Quoted (YAML booleans).
  contacts: "on"
  temperature: 0
  reasoning_effort: none
  max_output_tokens: 300

# Local demo API (Phase 4, docs/phase4-plan.md). `today`: the date the API gives the pipeline; null = the server
# date; CTA_API_TODAY=YYYY-MM-DD overrides it (demos, tests). The API listens on 127.0.0.1 only.
api:
  today: null
  max_question_chars: 500
  max_body_bytes: 4096

# Guardrails (Phase 4 step 7, docs/guardrails-plan.md and docs/decisions.md). API layer only. Each value can be
# overridden by an environment variable (CTA_API_DISABLED, CTA_DAILY_SPEND_CAP_USD, CTA_MONTHLY_SPEND_CAP_USD, CTA_RATE_PER_MINUTE,
# CTA_RATE_PER_DAY, CTA_MODEL_CALL_TIMEOUT_S, CTA_MODEL_RETRIES, CTA_REQUEST_TIMEOUT_S).
guardrails:
  disabled: false                 # the kill switch; the file data/api_disabled does the same without a restart
  daily_spend_cap_usd: 1.00       # per UTC day, summed from request_logs rows with source "api"
  monthly_spend_cap_usd: 5.00     # per UTC month, from the same rows; at the cap /ask answers a fixed "paused" reply
                                  # with no model call (after the safety screen). Below the $7 OpenAI project limit.
  monthly_spend_cache_s: 60       # the monthly sum is cached this long
  failed_request_cost_usd: 0.002  # counted for a failed request (its real cost is not known)
  spend_cache_s: 10               # the daily sum is cached this long
  rate_per_minute: 10             # per visitor, in memory only
  rate_per_day: 100
  rate_limit_max_keys: 10000
  model_call_timeout_s: 15        # each model call in an API request
  model_retries: 1                # retries inside an API request (the eval keeps MAX_RETRIES = 3)
  request_timeout_s: 45           # the whole request
  # Stage 2, content guards (src/cta/api/screen.py). CTA_DISTRESS_REPLY, CTA_INJECTION_SCREEN, CTA_PERSONAL_DATA.
  distress_reply: "988"           # "988" names the 988 Suicide & Crisis Lifeline and 911; "none" names no number
  injection_screen: true
  # Tester round 1b, Part 2: a question that does not look English gets ONE small model call that detects its
  # language and translates it to English (docs/archive/language-plan.md). CTA_LANGUAGE_STEP overrides it.
  language_step: true
  personal_data: "redact_and_refuse"   # off | redact | redact_and_refuse

# Optional developer tracing with LangSmith (docs/decisions.md, "Near-miss floor and tracing"). OFF by default and only
# in the API process. It is on only if this flag, the environment variable CTA_TRACING=on and LANGSMITH_API_KEY are all
# present. Turning it on for a public deployment is a separate owner decision (docs/phase4-plan.md).
tracing:
  enabled: false

max_chunk_tokens: 6000          # the loader fails instead of truncating (embedding limit is 8192)

eval:
  today: "2026-10-11"           # fixed date for reproducible runs
  max_cost_usd: 1.0             # a real run aborts if the estimate is higher

models:
  text-embedding-3-small:
    kind: embedding
    input: 0.02
    dimensions: 1536
  text-embedding-3-large:
    kind: embedding
    input: 0.13
    dimensions: 3072
  gpt-6-luna:
    kind: chat
    input: 0.10
    cached_input: 0.01
    output: 0.50
  gpt-5.6-terra:
    kind: chat
    input: 2.00
    cached_input: 0.20
    output: 12.00
  gpt-6.1-sol:    # rejects reasoning_effort none, temperature 0.1 and top_p (probed 2026-10-14): not an arm
    kind: chat
    input: 2.00
    cached_input: 0.10
    output: 10.00
  gpt-6-sol:      # the challenger of docs/archive/model-experiment-plan.md; accepts luna's settings (probed 2026-10-14)
    kind: chat    # price read 2026-10-14 from https://developers.openai.com/api/docs/pricing
    input: 2.00
    cached_input: 0.20
    output: 10.00
  gpt-4.1-mini:
    kind: chat
    input: 0.40
    cached_input: 0.10
    output: 1.60
  gpt-4o-mini:
    kind: chat
    input: 0.15
    cached_input: 0.075
    output: 0.60
