# Models, prices and run limits for Phase 2 (baseline RAG).
# Prices are USD per 1M tokens (standard tier, input <= 272K tokens), read on 2026-10-12 from
#   https://developers.openai.com/api/docs/pricing          (no page date; newest entry July 30, 2026)
#   https://developers.openai.com/api/docs/models           (no page date)
#   https://developers.openai.com/api/docs/models/gpt-6-luna and .../gpt-5.6-terra (no page date)
#   https://developers.openai.com/api/docs/guides/embeddings (no page date)
#   https://developers.openai.com/api/docs/deprecations     (newest entry 2026-10-01)
# Override the three model names with CTA_EMBEDDING_MODEL, CTA_CHAT_MODEL, CTA_JUDGE_MODEL in .env.
# A model that is not in `models` below is refused, so cost is never silently zero.

embedding_model: text-embedding-3-small
chat_model: gpt-6-luna          # answers
judge_model: gpt-5.6-terra      # eval judge: stronger than the answer model, on purpose

answer:
  # Checked 2026-10-12 with one real call to gpt-6-luna (Chat Completions): temperature, top_p and
  # reasoning_effort "none" were all accepted without error (docs/decisions.md).
  temperature: 0.1
  top_p: 0.3
  reasoning_effort: none
  k: 5
  max_output_tokens: 600
  # Chosen on dev only (step 8): the lowest top-1 similarity of an answerable, scored dev question is
  # 0.591 (q24); this is just below it, so no answerable dev question is blocked. It separates little:
  # see docs/decisions.md. Do not change it after looking at the test split.
  abstain_threshold: 0.59

# Judge settings. Probed 2026-10-12 on gpt-5.6-terra: temperature 0 is REJECTED with the default reasoning
# ("Only the default (1) value is supported"), but ACCEPTED with reasoning_effort "none"; JSON response
# format is accepted. So the judge runs at the lowest temperature, 0, with reasoning off.
judge:
  temperature: 0
  reasoning_effort: none
  max_output_tokens: 400

# Retrieval (Phase 3). `mode` is the experiment switch: vector (the frozen baseline), hybrid (Postgres ts_rank
# keyword side; rejected in experiment 1) or hybrid_bm25 (BM25 keyword side, experiment 1b). CTA_RETRIEVAL_MODE
# overrides it in .env. Hybrid = vector top `candidates` + keyword top `candidates`, reciprocal rank fusion.
retrieval:
  mode: vector
  candidates: 20
  rrf_k: 60
  # Department filter (Phase 3, step 2a): off | on. With a department named in the question, chunks of scope
  # "department" belonging to another department are dropped. CTA_DEPT_FILTER overrides it. Works with every mode.
  dept_filter: "off"   # quoted: bare off/on are booleans in YAML
  # LLM reranker (Phase 3, step 3): off | pool_a | pool_b (pools are fixed in src/cta/index/rerank.py).
  # CTA_RERANK overrides it. Quoted for the same YAML reason. pool_a since experiment 3 (kept by its
  # pre-registered rule); CTA_RERANK=off reproduces the earlier vector-only retrieval.
  rerank: "pool_a"

# Reranker call (the model is chat_model). Fixed in advance; see docs/experiments.md, step 3.
rerank:
  temperature: 0
  reasoning_effort: none
  max_output_tokens: 600

# Router (Phase 3, step 4a): off | on (on since step 4a-2, selector v2 kept by its pre-registered rule; CTA_ROUTER_MODE=off restores the old pipeline). With "on" a LangGraph graph (src/cta/graph/) sends calendar questions to a
# calendar lookup and everything else to the existing pipeline. CTA_ROUTER_MODE overrides it. Quoted: bare off/on are
# booleans in YAML. The classifier and the selector call the answer model (chat_model) with these settings.
router:
  mode: "on"
  # Selector version (step 4a-2): 1 = the pool is the rows of the resolved term; 2 = the rows of all
  # calendars with a stricter prompt. CTA_ROUTER_SELECTOR overrides it.
  selector: 2
  # Prerequisite-chain tool (Phase 3, step 4b): off | on (on since step 4b-final; CTA_ROUTER_CHAIN=off or --chain off turns it off). With "on" the classifier has a third intent,
  # "prerequisite", answered by a deterministic chain walk. CTA_ROUTER_CHAIN overrides it. Quoted (YAML booleans).
  chain: "on"
  # Who writes the chain answer (chain layout, docs/chain-layout-plan.md): "model" = the answer model, from the
  # chain description (the 4b behaviour); "code" = plain code (cta.graph.chain_render), no model call after the
  # classifier. "model" until the pre-registered keep rule passes. CTA_ROUTER_CHAIN_RENDER overrides it.
  chain_render: "model"
  # Contact line on every abstention (Phase 3, step 4c): off | on. Plain code (src/cta/graph/contact.py) appends
  # "Contact <name>: <email>, <phone>." from config/contacts.yaml; the model never writes it. On since step 4c
  # (replay check D1 to D8 of docs/step4c-plan.md passed); CTA_ROUTER_CONTACTS=off or --contacts off turns it off. Quoted (YAML booleans).
  contacts: "on"
  temperature: 0
  reasoning_effort: none
  max_output_tokens: 300

# Local demo API (Phase 4, docs/phase4-plan.md). `today`: the date the API gives the pipeline; null = the server
# date; CTA_API_TODAY=YYYY-MM-DD overrides it (demos, tests). The API listens on 127.0.0.1 only.
api:
  today: null
  max_question_chars: 500
  max_body_bytes: 4096

max_chunk_tokens: 6000          # the loader fails instead of truncating (embedding limit is 8192)

eval:
  today: "2026-10-11"           # fixed date for reproducible runs
  k_values: [1, 3, 5, 10]
  max_cost_usd: 1.0             # a real run aborts if the estimate is higher

models:
  text-embedding-3-small:
    kind: embedding
    input: 0.02
    dimensions: 1536
    max_input_tokens: 8192
  text-embedding-3-large:
    kind: embedding
    input: 0.13
    dimensions: 3072
    max_input_tokens: 8192
  gpt-6-luna:
    kind: chat
    input: 0.10
    cached_input: 0.01
    output: 0.50
    context_tokens: 1050000
  gpt-5.6-terra:
    kind: chat
    input: 2.00
    cached_input: 0.20
    output: 12.00
    context_tokens: 1050000
  gpt-6.1-sol:
    kind: chat
    input: 2.00
    cached_input: 0.10
    output: 10.00
  gpt-4.1-mini:
    kind: chat
    input: 0.40
    cached_input: 0.10
    output: 1.60
  gpt-4o-mini:
    kind: chat
    input: 0.15
    cached_input: 0.075
    output: 0.60
