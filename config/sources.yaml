# Sources for the crawl. Generated from CLAUDE.md ("Data sources" and "Page status"). Do not add
# a host or path here without updating CLAUDE.md. Contact email comes from .env, never from this file.

allowed_hosts:
  - www.citytech.cuny.edu
  - citytech.catalog.cuny.edu
  - app.coursedog.com

crawl:
  min_interval_seconds: 1.0
  user_agent_template: "CityTechAssistantBot/0.1 (student portfolio project; contact: {email})"
  contact_email_env: CTA_CONTACT_EMAIL
  max_redirects: 5

catalog_api:
  base_url: https://app.coursedog.com/api/v1
  school: nyt01
  catalog_id: qPpQUgUy149umoKU2soi
  origin: https://citytech.catalog.cuny.edu
  effective_date: "2026-08-28"
  page_size: 20
  expected_total: 1445
  # POST {base_url}/cm/{school}/courses/search/%24filters?catalogId=...&skip=..&limit=..&orderBy=code
  search_path: /cm/nyt01/courses/search/%24filters
  # GET {base_url}/nyt01/requirementGroups/<ID>?returnFields=code,catalogDisplayName,descriptionLong
  rule_path: /nyt01/requirementGroups/{rule_id}
  rule_return_fields: code,catalogDisplayName,descriptionLong
  columns: code,name,description,departments,requirementGroup,credits,status,subjectCode,courseNumber,customFields.catalogAttributes,customFields.cuLibartsFlag
  departments:
    - id: CST-NYT
      name: "Computer Systems Technology"
    - id: MATH-NYT
      name: "Mathematics"
    - id: EET-NYT
      name: "Electrical & Telecommunications Engineering Technology"
    - id: DENT-NYT
      name: "Dental Hygiene"

